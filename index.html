        * { margin: 0; padding: 0; box-sizing: border-box; }

        #app { display: flex; height: 100vh; }
        #sidebar {
            width: 380px; min-width: 380px; background: #fff;

        }
        #sidebar-header {
            padding: 16px; background: #006fcf; color: #fff;
        }
        #sidebar-header h1 { font-size: 18px; margin-bottom: 4px; }
        #sidebar-header p { font-size: 12px; opacity: 0.85; }
        #search-bar {
            padding: 12px 16px; border-bottom: 1px solid #eee;
        }
        #search-input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none;
        }
        #search-input:focus { border-color: #006fcf; box-shadow: 0 0 0 2px rgba(0,111,207,0.15); }
        #filters {
            padding: 8px 16px; border-bottom: 1px solid #eee;
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .filter-btn {
            padding: 4px 10px; border: 1px solid #ddd; border-radius: 16px;
            font-size: 12px; cursor: pointer; background: #fff; white-space: nowrap;
        }
        .filter-btn.active { background: #006fcf; color: #fff; border-color: #006fcf; }
        #restaurant-list {
            flex: 1; overflow-y: auto; padding: 8px;
        }
        .restaurant-card {
            padding: 12px; margin-bottom: 6px; border-radius: 8px; cursor: pointer;
            border: 1px solid #eee; transition: all 0.15s;
        }
        .restaurant-card:hover { border-color: #006fcf; background: #f0f7ff; }
        .restaurant-card.highlighted { border-color: #006fcf; background: #e6f0ff; }
        .restaurant-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
        .restaurant-name-zh { font-size: 13px; color: #555; margin-top: 1px; }
        .restaurant-group { font-size: 11px; color: #006fcf; margin-top: 4px; font-weight: 500; }
        .restaurant-discount {
            display: inline-block; margin-top: 4px; padding: 2px 8px;
            background: #e8f5e9; color: #2e7d32; border-radius: 4px; font-size: 12px; font-weight: 600;
        }
        .restaurant-address { font-size: 12px; color: #777; margin-top: 4px; line-height: 1.3; }
        .restaurant-meta { font-size: 11px; color: #999; margin-top: 4px; }
        .card-badge {
            display: inline-block; margin-top: 4px; padding: 1px 6px;
            background: #e3f2fd; color: #1565c0; border-radius: 3px; font-size: 10px; font-weight: 500;
        }
        #count-bar {
            padding: 8px 16px; font-size: 12px; color: #888; border-bottom: 1px solid #eee;
        }
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        .leaflet-popup-content-wrapper { border-radius: 10px; }
        .leaflet-popup-content { margin: 12px 16px; font-family: inherit; }
        .popup-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
        .popup-name-zh { font-size: 14px; color: #555; }
        .popup-group { font-size: 12px; color: #006fcf; margin-top: 4px; }
        .popup-discount { font-size: 14px; color: #2e7d32; font-weight: 600; margin-top: 6px; }
        .popup-details { font-size: 11px; color: #555; margin-top: 4px; line-height: 1.5; white-space: pre-line; }
        .popup-address { font-size: 12px; color: #777; margin-top: 6px; line-height: 1.4; }
        .popup-cards { font-size: 11px; color: #1565c0; margin-top: 4px; }
        .popup-timing { font-size: 11px; color: #888; margin-top: 2px; }

        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #sidebar { width: 100%; min-width: auto; height: 45vh; }
            #map-container { height: 55vh; }
        }

// Group colors
const groupColors = {
    "1957 & Co.": "#e74c3c",
    "agnès b. CAFÉ": "#e91e63",
    "Cafe Deco Group": "#9c27b0",
    "Chess House": "#673ab7",
    "Elite Concepts": "#3f51b5",
    "JIA Group": "#2196f3",
    "Heichinrou": "#ff9800",
    "Mira Dining": "#009688",
    "Peony": "#4caf50",
    "S&S Hospitality": "#795548",
    "The Food Story": "#ff5722",
    "Wooloomooloo Group": "#607d8b",
};

// All Maxim's brands get the same red color
const maximsColor = "#d32f2f";

function getGroupColor(group) {
    if (group.includes("Maxim's")) return maximsColor;
    return groupColors[group] || '#006fcf';
}

// Init map
const map = L.map('map').setView([22.320, 114.17], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
}).addTo(map);

// Create markers
const markers = [];
restaurants.forEach((r, i) => {
    const color = getGroupColor(r.group);
    const label = r.discountPct >= 40 ? '40' : r.discountPct;
    const icon = L.divIcon({
        className: 'custom-marker',
        html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;">${label}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -16],
    });

    const marker = L.marker([r.lat, r.lng], { icon }).addTo(map);
    marker.bindPopup(`
        <div class="popup-name">${r.name}</div>
        ${r.nameZh ? `<div class="popup-name-zh">${r.nameZh}</div>` : ''}
        <div class="popup-group">${r.group}</div>
        <div class="popup-discount">${r.discount}</div>
        ${r.details ? `<div class="popup-details">${r.details}</div>` : ''}
        <div class="popup-address">${r.address}</div>
        <div class="popup-cards">Card: ${r.cards}</div>
        <div class="popup-timing">Timing: ${r.timing}</div>
    `, { maxWidth: 320 });

    markers.push({ marker, data: r, index: i });
});

// Render list
const listEl = document.getElementById('restaurant-list');
const countEl = document.getElementById('count-bar');
const searchInput = document.getElementById('search-input');
let activeFilter = 'all';
let highlightedIdx = null;

function renderList(filtered) {
    countEl.textContent = `${filtered.length} restaurant${filtered.length !== 1 ? 's' : ''} found`;
    listEl.innerHTML = filtered.map(({ data: r, index: i }) => `
        <div class="restaurant-card ${highlightedIdx === i ? 'highlighted' : ''}" data-index="${i}">
            <div class="restaurant-name">${r.name}</div>
            ${r.nameZh ? `<div class="restaurant-name-zh">${r.nameZh}</div>` : ''}
            <div class="restaurant-group">${r.group}</div>
            <div class="restaurant-discount">${r.discount}</div>
            <div class="restaurant-address">${r.address}</div>
            <div class="restaurant-meta">${r.timing}</div>
            <div class="card-badge">${r.cards}</div>
        </div>
    `).join('');

    listEl.querySelectorAll('.restaurant-card').forEach(card => {
        card.addEventListener('click', () => {
            const idx = parseInt(card.dataset.index);
            const m = markers[idx];
            highlightedIdx = idx;
            map.setView([m.data.lat, m.data.lng], 17);
            m.marker.openPopup();
            renderList(filtered);
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    });
}

function applyFilters() {
    const query = searchInput.value.toLowerCase().trim();
    let filtered = markers.filter(({ data: r }) => {
        // Text search
        if (query) {
            const text = `${r.name} ${r.nameZh} ${r.group} ${r.address} ${r.discount} ${r.cards} ${r.timing}`.toLowerCase();
            if (!text.includes(query)) return false;
        }
        // Filter buttons
        if (activeFilter === 'all') return true;
        if (activeFilter === '30up') return r.discountPct >= 30;
        if (activeFilter === 'maxims') return r.group.includes("Maxim's");
        if (activeFilter === 'central') return r.area === 'central';
        if (activeFilter === 'tst') return r.area === 'tst';
        if (activeFilter === 'cwb') return r.area === 'cwb';
        if (activeFilter === 'kowloon') return r.area === 'kowloon';
        if (activeFilter === 'nt') return r.area === 'nt';
        return true;
    });
    renderList(filtered);

    // Update marker visibility
    markers.forEach(({ marker, data: r }) => {
        const inFiltered = filtered.some(f => f.data === r);
        marker.setOpacity(inFiltered ? 1 : 0.15);
    });
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        applyFilters();
    });
});

// Search
searchInput.addEventListener('input', applyFilters);

// Initial render
applyFilters();
</script>
